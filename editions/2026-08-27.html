<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>AI News Daily — The Daily Brief, 27 August 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--bg:#f0eee6;--surface:#ffffff;--surface-hi:#faf8f3;--border:rgba(45,43,39,0.10);--border-hi:rgba(45,43,39,0.18);--text:#2d2b27;--text-secondary:#59554e;--text-tertiary:#8a8579;--accent:#c2714c;--accent-dim:rgba(194,113,76,0.10);--tag-india:#c44d3a;--tag-global:#4a7ba8;--tag-research:#4a8a6a;--tag-policy:#a87c2e;--tag-frameworks:#5b6b8a;--tag-rag:#5a8a7c;--tag-vision:#8a5e4a;--tag-tools:#6b7a4a;--shadow-card:0 1px 3px rgba(45,43,39,0.06),0 1px 2px rgba(45,43,39,0.04);--shadow-elev:0 8px 24px rgba(45,43,39,0.10),0 2px 6px rgba(45,43,39,0.06);--radius:14px;--radius-sm:8px;--font-serif:'Lora',Georgia,serif;--font-sans:'Inter',-apple-system,sans-serif;--font-mono:'JetBrains Mono','SF Mono',Consolas,monospace;--pad:24px;--max-w:1200px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:var(--font-sans);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
    .site-header{position:sticky;top:0;z-index:100;background:rgba(240,238,230,0.93);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);width:100%}
    .header-bar{display:flex;align-items:center;gap:14px;padding:12px var(--pad);max-width:var(--max-w);margin:0 auto}
    .header-logo{width:38px;height:38px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:700;font-size:18px;color:#fff;flex-shrink:0}
    .header-brand-wrap{display:flex;flex-direction:column}
    .header-brand{font-weight:700;font-size:1.15rem;letter-spacing:-0.01em}
    .header-tagline{font-family:var(--font-mono);font-size:0.68rem;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.1em}
    .header-search{margin-left:auto;position:relative}
    .header-search input{width:240px;padding:8px 12px 8px 34px;border:1px solid var(--border-hi);border-radius:var(--radius-sm);font-family:var(--font-sans);font-size:0.82rem;background:var(--surface);color:var(--text);transition:border-color 0.15s,box-shadow 0.15s,width 0.2s}
    .header-search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);width:280px}
    .header-search input::placeholder{color:var(--text-tertiary)}
    .header-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-tertiary);font-size:0.85rem;pointer-events:none}
    .header-nav{display:flex;gap:0;border-top:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 var(--pad);max-width:var(--max-w);margin:0 auto}
    .header-nav a{font-family:var(--font-mono);font-size:0.78rem;font-weight:500;padding:10px 14px;color:var(--text-secondary);white-space:nowrap;border-bottom:2px solid transparent;transition:color 0.15s,border-color 0.15s;display:flex;align-items:center;gap:6px}
    .header-nav a:hover{color:var(--accent);text-decoration:none}
    .header-nav a.active{color:var(--accent);border-bottom-color:var(--accent)}
    .header-nav .dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
    .dot--india{background:var(--tag-india)}.dot--global{background:var(--tag-global)}.dot--research{background:var(--tag-research)}.dot--policy{background:var(--tag-policy)}.dot--frameworks{background:var(--tag-frameworks)}.dot--rag{background:var(--tag-rag)}.dot--vision{background:var(--tag-vision)}.dot--tools{background:var(--tag-tools)}.dot--all{background:var(--accent)}
    .hero{padding:48px var(--pad) 32px;text-align:center;max-width:var(--max-w);margin:0 auto}
    .hero__label{font-family:var(--font-mono);font-size:0.78rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--accent);margin-bottom:14px}
    .hero__title{font-family:var(--font-serif);font-weight:700;font-size:3rem;line-height:1.1;letter-spacing:-0.02em;margin-bottom:16px}
    .hero__subtitle{font-family:var(--font-serif);font-style:italic;font-size:1.15rem;color:var(--text-secondary);line-height:1.5;max-width:680px;margin:0 auto 24px}
    .hero__meta{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
    .hero__meta-item{text-align:center}.hero__meta-num{font-family:var(--font-serif);font-weight:700;font-size:1.5rem;color:var(--text)}.hero__meta-label{font-family:var(--font-mono);font-size:0.68rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-tertiary);margin-top:2px}
    .section-label{font-family:var(--font-mono);font-size:0.8rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--text);margin-bottom:20px;display:flex;align-items:center;gap:8px;padding:0 var(--pad);max-width:var(--max-w);margin-left:auto;margin-right:auto}.section-label::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent)}.section-label__line{flex:1;height:1px;background:var(--border);margin-left:4px}
    .featured{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-elev);padding:28px var(--pad);margin:0 auto 32px;max-width:calc(var(--max-w) - var(--pad) * 2);transition:transform 0.2s ease}.featured:hover{transform:translateY(-2px)}
    .featured__badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--accent);background:var(--accent-dim);padding:5px 12px;border-radius:4px;margin-bottom:14px}
    .featured__date{font-family:var(--font-mono);font-size:0.78rem;color:var(--text-tertiary);margin-bottom:8px}
    .featured__headline{font-family:var(--font-serif);font-weight:700;font-size:1.7rem;line-height:1.25;letter-spacing:-0.015em;margin-bottom:10px}.featured__headline a{color:var(--text)}.featured__headline a:hover{color:var(--accent);text-decoration:none}
    .featured__summary{font-size:0.95rem;color:var(--text-secondary);line-height:1.6;margin-bottom:14px}
    .featured__tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .tag{font-family:var(--font-mono);font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;padding:4px 10px;border-radius:4px}
    .tag--india{background:rgba(196,77,58,0.12);color:var(--tag-india)}.tag--global{background:rgba(74,123,168,0.12);color:var(--tag-global)}.tag--researche{background:rgba(74,138,106,0.12);color:var(--tag-research)}.tag--policy{background:rgba(168,124,46,0.12);color:var(--tag-policy)}.tag--frameworks{background:rgba(91,107,138,0.12);color:var(--tag-frameworks)}.tag--rag{background:rgba(90,138,124,0.12);color:var(--tag-rag)}.tag--vision{background:rgba(138,94,74,0.12);color:var(--tag-vision)}.tag--tools{background:rgba(107,122,74,0.12);color:var(--tag-tools)}
    .featured__cta{font-family:var(--font-mono);font-size:0.82rem;color:var(--accent);display:inline-flex}
    .featured__cta:hover{text-decoration:none}
    .archive{list-style:none;padding:0 var(--pad);margin-bottom:32px;max-width:var(--max-w);margin-left:auto;margin-right:auto}
    .archive__item{display:flex;align-items:flex-start;gap:20px;padding:20px 0;border-bottom:1px solid var(--border);transition:transform 0.15s}.archive__item:last-child{border-bottom:none}.archive__item:hover{transform:translateX(4px)}
    .archive__date{font-family:var(--font-mono);font-size:0.75rem;color:var(--accent);background:var(--accent-dim);padding:6px 10px;border-radius:6px;white-space:nowrap;flex-shrink:0;text-align:center;line-height:1.3}
    .archive__body{flex:1;min-width:0}
    .archive__headline{font-family:var(--font-serif);font-weight:600;font-size:1.1rem;line-height:1.3;margin-bottom:4px}.archive__headline a{color:var(--text)}.archive__headline a:hover{color:var(--accent);text-decoration:none}
    .archive__summary{font-size:0.85rem;color:var(--text-secondary);line-height:1.5}
    .archive__tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.archive__tags .tag{font-size:0.62rem;padding:2px 7px}
    .sidebar-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:0 var(--pad);margin-bottom:48px;max-width:var(--max-w);margin-left:auto;margin-right:auto}
    .sidebar__section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-card);padding:20px 22px}
    .sidebar__title{font-family:var(--font-mono);font-size:0.75rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
    .about__text{font-size:0.85rem;color:var(--text-secondary);line-height:1.55}.about__text strong{color:var(--text)}
    .topics{list-style:none;padding:0}.topics li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}.topics li:last-child{border-bottom:none}.topics .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.topics .name{font-size:0.85rem;font-weight:500;color:var(--text);flex:1}.topics .count{font-family:var(--font-mono);font-size:0.73rem;color:var(--text-tertiary)}
    .schedule__time{font-family:var(--font-serif);font-weight:700;font-size:1.5rem;color:var(--text)}.schedule__tz{font-family:var(--font-mono);font-size:0.73rem;color:var(--text-tertiary);margin-top:2px}.schedule__note{font-size:0.82rem;color:var(--text-secondary);margin-top:10px;line-height:1.5}
    .subscribe__text{font-size:0.82rem;color:var(--text-secondary);margin-bottom:10px;line-height:1.5}
    .footer{border-top:1px solid var(--border);background:var(--surface-hi);padding:36px var(--pad);text-align:center;max-width:var(--max-w);margin:0 auto}
    .footer__logo{width:32px;height:32px;border-radius:50%;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-weight:700;font-size:15px;color:#fff;margin-bottom:10px}
    .footer__brand{font-weight:700;font-size:1rem;margin-bottom:6px}
    .footer__links{display:flex;justify-content:center;gap:20px;margin:14px 0;flex-wrap:wrap}.footer__links a{font-family:var(--font-mono);font-size:0.78rem;color:var(--text-secondary)}.footer__links a:hover{color:var(--accent)}
    .footer__meta{font-family:var(--font-mono);font-size:0.72rem;color:var(--text-tertiary);margin-bottom:8px}
    .footer__disclaimer{font-size:0.8rem;color:var(--text-tertiary);max-width:440px;margin:0 auto;line-height:1.5}
    .fade-up{opacity:0;transform:translateY(20px);animation:fadeUp 0.5s ease forwards}@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
    @media(max-width:768px){.header-search{display:none}.hero__title{font-size:2.2rem}.featured__headline{font-size:1.3rem}.archive__item{flex-direction:column;gap:10px}}
    @media(max-width:480px){.hero__title{font-size:1.8rem}.hero__meta{gap:16px}.hero__meta-num{font-size:1.2rem}}
    @media(prefers-reduced-motion:reduce){.fade-up{animation:none;opacity:1;transform:none}*{transition:none!important}html{scroll-behavior:auto}}
  </style>
</head>
</html>

name: Publish Edition

on:
  push:
    paths:
      - '_pending/ready.txt'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Assemble and decompress files
        run: |
          set -e
          EDITION_B64=$(cat _pending/edition_*.part | tr -d '\n')
          INDEX_B64=$(cat _pending/index_*.part | tr -d '\n')
          echo "$EDITION_B64" | base64 -d | gzip -d > editions/2026-08-15.html
          echo "$INDEX_B64" | base64 -d | gzip -d > index.html
          echo "Edition size: $(wc -c < editions/2026-08-15.html)"
          echo "Index size: $(wc -c < index.html)"
      
      - name: Commit and push
        run: |
          git config user.name "AI News Daily"
          git config user.email "ai-news-daily@users.noreply.github.com"
          git add editions/2026-08-15.html index.html
          git commit -m "feat: publish AI News Daily edition for 15 August 2026"
          git rm -r _pending/
          git commit -m "chore: clean up pending files"
          git push